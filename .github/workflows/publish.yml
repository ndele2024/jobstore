# Construit les deux images de JobStore, les publie sur GHCR, puis demande
# au VPS de les recuperer. Le serveur ne compile jamais.
name: Publier et deployer JobStore

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRE: ghcr.io
  PROPRIETAIRE: ndele2024

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nom: jobstore-web
            contexte: ./frontend
            dockerfile: frontend/Dockerfile
          - nom: jobstore-api
            contexte: ./backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRE }}/${{ env.PROPRIETAIRE }}/${{ matrix.nom }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement:
    needs: images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Bascule sur le VPS
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          # La cle est bridee cote serveur par une commande forcee : elle ne peut
          # que deployer jobstore, quoi que l'on envoie ici. Le texte n'est
          # que consigne dans le journal de deploiement du VPS.
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'deployer jobstore'
