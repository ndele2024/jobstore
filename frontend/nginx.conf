server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Televersement de CV : PDF, DOC, DOCX, TXT.
    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Les controleurs ASP.NET declarent deja le prefixe « api » :
    # l'URI est transmise telle quelle.
    location /api/ {
        # Resolution DNS a chaque requete plutot qu'au demarrage. Avec un nom
        # d'hote litteral, nginx refuse de demarrer tant que le conteneur d'API
        # n'existe pas : une API en panne emporterait aussi le site statique.
        # Ici, nginx demarre toujours et ne renvoie 502 que sur /api/.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api api:8080;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'analyse d'un CV par l'IA peut demander une bonne minute.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
